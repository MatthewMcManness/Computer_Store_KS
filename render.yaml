services:
  # =============================================================================
  # PRODUCTION - Main Website (deploys from Computer-Store-KS branch)
  # =============================================================================
  - type: web
    name: computer-store-ks
    env: node
    branch: Computer-Store-KS
    buildCommand: npm install && npm run build && cp -r .next/static .next/standalone/.next/static && rm -rf .next/standalone/public && cp -R public .next/standalone/ && cp -r node_modules .next/standalone/ && cp package.json .next/standalone/
    startCommand: cd .next/standalone && node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOSTNAME
        value: 0.0.0.0
      # Email service for contact form (REQUIRED)
      - key: RESEND_API_KEY
        sync: false
      # Authentication settings (REQUIRED for admin panel)
      - key: AUTH_MODE
        value: repairshopr
      - key: SESSION_SECRET
        sync: false
      - key: REPAIRSHOPR_SUBDOMAIN
        value: thecomputerstore
      # Gallery admin authentication (legacy mode fallback)
      - key: ADMIN_PASSWORD
        sync: false
      # GitHub integration for gallery (OPTIONAL - only if you use gallery manager)
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: MatthewMcManness
      - key: GITHUB_REPO
        value: Computer_Store_KS
      - key: GITHUB_BRANCH
        value: Computer-Store-KS
      # Static site URL for "View Site" link
      - key: NEXT_PUBLIC_SITE_URL
        value: https://computerstoreks.com
      # Supabase (REQUIRED for customer portal and blog)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # =============================================================================
  # DEVELOPMENT - Staging/Test Environment (deploys from dev branch)
  # =============================================================================
  - type: web
    name: computer-store-ks-dev
    env: node
    branch: dev
    buildCommand: npm install && npm run build && cp -r .next/static .next/standalone/.next/static && rm -rf .next/standalone/public && cp -R public .next/standalone/ && cp -r node_modules .next/standalone/ && cp package.json .next/standalone/
    startCommand: cd .next/standalone && node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOSTNAME
        value: 0.0.0.0
      # Email service for contact form (REQUIRED)
      - key: RESEND_API_KEY
        sync: false
      # Authentication settings (REQUIRED for admin panel)
      - key: AUTH_MODE
        value: repairshopr
      - key: SESSION_SECRET
        sync: false
      - key: REPAIRSHOPR_SUBDOMAIN
        value: thecomputerstore
      # Gallery admin authentication (legacy mode fallback)
      - key: ADMIN_PASSWORD
        sync: false
      # GitHub integration for gallery (OPTIONAL - only if you use gallery manager)
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: MatthewMcManness
      - key: GITHUB_REPO
        value: Computer_Store_KS
      - key: GITHUB_BRANCH
        value: dev
      # Static site URL for "View Site" link (dev URL)
      - key: NEXT_PUBLIC_SITE_URL
        value: https://computer-store-ks-dev.onrender.com
      # Supabase (REQUIRED for customer portal and blog)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
