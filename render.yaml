services:
  # Main Next.js Website (includes contact form and gallery)
  - type: web
    name: computer-store-ks
    env: node
    buildCommand: rm -rf .next && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      # Email service for contact form (REQUIRED)
      - key: RESEND_API_KEY
        sync: false
      # Gallery admin authentication (OPTIONAL - defaults to admin123)
      - key: ADMIN_PASSWORD
        sync: false
      # GitHub integration for gallery (OPTIONAL - only if you use gallery manager)
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: MatthewMcManness
      - key: GITHUB_REPO
        value: Computer_Store_KS
      - key: GITHUB_BRANCH
        value: Computer-Store-KS
