services:
  # Main Next.js Website (includes contact form and gallery)
  - type: web
    name: computer-store-ks
    env: node
    buildCommand: npm install && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      # Email service for contact form (REQUIRED)
      - key: RESEND_API_KEY
        sync: false
      # Authentication settings (REQUIRED for admin panel)
      - key: AUTH_MODE
        value: repairshopr
      - key: SESSION_SECRET
        sync: false
      - key: REPAIRSHOPR_SUBDOMAIN
        value: thecomputerstore
      # Gallery admin authentication (legacy mode fallback)
      - key: ADMIN_PASSWORD
        sync: false
      # GitHub integration for gallery (OPTIONAL - only if you use gallery manager)
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: MatthewMcManness
      - key: GITHUB_REPO
        value: Computer_Store_KS
      - key: GITHUB_BRANCH
        value: Computer-Store-KS
      # Static site URL for "View Site" link
      - key: NEXT_PUBLIC_SITE_URL
        value: https://computerstoreks.com
