services:
  - type: web
    name: Computer_Store_KS
    env: node
    plan: free
    region: oregon
    branch: Production
    buildCommand: npm ci && npm run build && cp -r .next/static .next/standalone/.next/static && rm -rf .next/standalone/public && cp -R public .next/standalone/ && cp package.json .next/standalone/
    startCommand: cd .next/standalone && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOSTNAME
        value: 0.0.0.0
      # Supabase (REQUIRED)
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Email (REQUIRED for contact form)
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL
        value: contact@computerstoreks.com
      # Site URL (REQUIRED for OAuth redirects)
      - key: NEXT_PUBLIC_SITE_URL
        value: https://computerstoreks.com
      # Cloudflare Turnstile (optional)
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
