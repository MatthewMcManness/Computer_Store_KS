version: '3.8'

services:
  computer-store-ks:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: computer-store-ks
    restart: unless-stopped
    ports:
      - "3000:3000"  # Next.js application
    environment:
      - NODE_ENV=production
      - PORT=3000
      # GitHub Integration
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER:-MatthewMcManness}
      - GITHUB_REPO=${GITHUB_REPO:-Computer_Store_KS}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-Computer-Store-KS}
      # Admin Authentication
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Email (Resend)
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-contact@computerstoreks.com}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - webnet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  webnet:
    external: true
    name: webnet
