<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playing Game | CSK Games | Computer Store Kansas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:       #0366d6;
      --blue-dark:  #0256b8;
      --blue-light: #e8f1fc;
      --blue-mid:   #b3d0f5;
      --white:      #ffffff;
      --gray:       #6b7c93;
      --gray-light: #eaf0f8;
      --dark:       #0d1b2e;
      --text:       #1a2a3d;
    }

    html, body {
      height: 100%;
      font-family: 'Barlow', sans-serif;
      background: var(--dark);
      color: var(--white);
      overflow: hidden;
    }

    /* ── LAYOUT ─────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── TOP BAR ────────────────────────────── */
    #topbar {
      background: var(--dark);
      border-bottom: 2px solid #1a3a5c;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      gap: 1rem;
      flex-shrink: 0;
      z-index: 10;
      transition: height 0.3s ease, opacity 0.3s ease;
    }

    #topbar.hidden {
      height: 0;
      opacity: 0;
      overflow: hidden;
      border: none;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
    }

    .logo-wrap img {
      height: 34px;
      width: auto;
      display: block;
      filter: brightness(10);
      opacity: 0.85;
    }

    .logo-fallback {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--blue-mid);
      letter-spacing: 0.02em;
    }

    .divider {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.12);
    }

    .game-title-bar {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
    }

    .game-title-bar span {
      color: var(--blue-mid);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      border-radius: 6px;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
      white-space: nowrap;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-ghost {
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .btn-ghost:hover {
      background: rgba(255,255,255,0.12);
      color: var(--white);
    }

    .btn-blue {
      background: var(--blue);
      color: var(--white);
    }
    .btn-blue:hover { background: var(--blue-dark); }

    .btn-back {
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .btn-back:hover {
      background: rgba(255,255,255,0.12);
      color: var(--white);
    }
    .btn-back::before { content: '←'; margin-right: 0.2rem; }

    /* ── GAME FRAME AREA ────────────────────── */
    #frame-wrap {
      flex: 1;
      position: relative;
      background: var(--dark);
      overflow: hidden;
    }

    #game-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    /* ── LOADING OVERLAY ────────────────────── */
    #loader {
      position: absolute;
      inset: 0;
      background: var(--dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      z-index: 20;
      transition: opacity 0.5s ease;
    }

    #loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loader-icon {
      font-size: 3.5rem;
      animation: pulse 1.5s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.1); opacity: 0.7; }
    }

    .loader-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 1.6rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--white);
    }

    .loader-sub {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.04em;
    }

    .loader-bar-wrap {
      width: 220px;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .loader-bar {
      height: 100%;
      width: 0%;
      background: var(--blue);
      border-radius: 2px;
      animation: loadbar 1.8s ease forwards;
    }

    @keyframes loadbar {
      0%   { width: 0%; }
      60%  { width: 75%; }
      100% { width: 100%; }
    }

    /* ── BOTTOM BAR ─────────────────────────── */
    #bottombar {
      background: #0a1628;
      border-top: 1px solid #1a3a5c;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      flex-shrink: 0;
      transition: height 0.3s ease, opacity 0.3s ease;
    }

    #bottombar.hidden {
      height: 0;
      opacity: 0;
      overflow: hidden;
      border: none;
    }

    .bottombar-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
      animation: blink 2s ease infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .status-text {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    .bottombar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .bottombar-link {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      transition: color 0.2s;
    }
    .bottombar-link:hover { color: var(--blue-mid); }

    /* ── FULLSCREEN STATE ───────────────────── */
    body.is-fullscreen #topbar,
    body.is-fullscreen #bottombar {
      height: 0;
      opacity: 0;
      overflow: hidden;
      border: none;
    }

    /* ── FULLSCREEN HINT ────────────────────── */
    #fs-hint {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(3,102,214,0.85);
      backdrop-filter: blur(6px);
      color: var(--white);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      z-index: 15;
      cursor: pointer;
      transition: opacity 0.5s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    #fs-hint.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* ── EXIT FULLSCREEN BUTTON ─────────────── */
    #exit-fs-btn {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(13,27,46,0.85);
      backdrop-filter: blur(6px);
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.15);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      z-index: 15;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.2s;
    }

    #exit-fs-btn:hover {
      background: rgba(3,102,214,0.85);
      color: var(--white);
    }

    body.is-fullscreen #exit-fs-btn {
      display: flex;
    }

    /* ── RESPONSIVE ─────────────────────────── */
    @media (max-width: 500px) {
      .game-title-bar { display: none; }
      .divider { display: none; }
      .btn-ghost { display: none; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div id="topbar">
    <div class="topbar-left">
      <a href="/" class="logo-wrap">
        <img src="/assets/csk-logo.png" alt="CSK" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
        <span class="logo-fallback" style="display:none;">CSK</span>
      </a>
      <div class="divider"></div>
      <div class="game-title-bar">Now Playing: <span id="game-name-display">Game</span></div>
    </div>
    <div class="topbar-right">
      <button class="btn btn-ghost" onclick="reloadGame()">↺ Restart</button>
      <button class="btn btn-blue" onclick="goFullscreen()">⛶ Full Screen</button>
      <a id="back-btn" href="../index.html" class="btn btn-back">Games</a>
    </div>
  </div>

  <!-- GAME FRAME AREA -->
  <div id="frame-wrap">

    <!-- Loading overlay -->
    <div id="loader">
      <div class="loader-icon" id="loader-icon">🎮</div>
      <div class="loader-title" id="loader-title">Loading Game</div>
      <div class="loader-sub">Powered by Computer Store Kansas</div>
      <div class="loader-bar-wrap">
        <div class="loader-bar"></div>
      </div>
    </div>

    <!-- Fullscreen hint -->
    <div id="fs-hint" onclick="goFullscreen()">⛶ Click for Full Screen</div>

    <!-- Exit fullscreen button (visible only when fullscreen) -->
    <button id="exit-fs-btn" onclick="exitFullscreen()">✕ Exit Full Screen</button>

    <!-- The game iframe -->
    <iframe
      id="game-frame"
      src=""
      allowfullscreen
      allow="fullscreen; autoplay"
      scrolling="auto"
      title="Game">
    </iframe>

  </div>

  <!-- BOTTOM BAR -->
  <div id="bottombar">
    <div class="bottombar-left">
      <div class="status-dot"></div>
      <span class="status-text">Game Running</span>
    </div>
    <div class="bottombar-right">
      <a href="../index.html" class="bottombar-link">← All Games</a>
      <a href="/" class="bottombar-link">computerstoreks.com</a>
    </div>
  </div>

</div>

<script>
  // ── READ URL PARAMS ───────────────────────────────────────────────
  const params   = new URLSearchParams(window.location.search);
  const gameUrl  = params.get('url')   || '';
  const gameName = params.get('name')  || 'Game';
  const gameIcon = params.get('icon')  || '🎮';
  const backUrl  = params.get('back')  || '../index.html';

  // ── POPULATE PAGE ─────────────────────────────────────────────────
  document.title = `Playing ${gameName} | CSK Games`;
  document.getElementById('game-name-display').textContent = gameName;
  document.getElementById('loader-title').textContent      = gameName;
  document.getElementById('loader-icon').textContent       = gameIcon;
  document.getElementById('back-btn').href                 = backUrl;

  // Load the game into the iframe
  const frame = document.getElementById('game-frame');
  if (gameUrl) {
    frame.src = gameUrl;
  }

  // ── HIDE LOADER WHEN IFRAME LOADS ────────────────────────────────
  frame.addEventListener('load', function () {
    setTimeout(() => {
      const loader = document.getElementById('loader');
      loader.classList.add('fade-out');
      setTimeout(() => loader.style.display = 'none', 500);
    }, 600);
  });

  // Auto-hide the fullscreen hint after 4 seconds
  setTimeout(() => {
    const hint = document.getElementById('fs-hint');
    if (hint) hint.classList.add('fade-out');
  }, 4000);

  // ── FULLSCREEN ────────────────────────────────────────────────────
  function goFullscreen() {
    const el = document.documentElement; // whole browser window
    if (el.requestFullscreen)            el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
    else if (el.msRequestFullscreen)     el.msRequestFullscreen();
  }

  function exitFullscreen() {
    if (document.exitFullscreen)             document.exitFullscreen();
    else if (document.webkitExitFullscreen)  document.webkitExitFullscreen();
    else if (document.mozCancelFullScreen)   document.mozCancelFullScreen();
    else if (document.msExitFullscreen)      document.msExitFullscreen();
  }

  // Sync the is-fullscreen class with actual browser fullscreen state
  document.addEventListener('fullscreenchange',       syncFullscreenClass);
  document.addEventListener('webkitfullscreenchange', syncFullscreenClass);
  document.addEventListener('mozfullscreenchange',    syncFullscreenClass);

  function syncFullscreenClass() {
    const inFS = !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.mozFullScreenElement
    );
    document.body.classList.toggle('is-fullscreen', inFS);
  }

  // ── RESTART GAME ─────────────────────────────────────────────────
  function reloadGame() {
    frame.src = '';
    setTimeout(() => { frame.src = gameUrl; }, 100);
    document.getElementById('loader').style.display = 'flex';
    document.getElementById('loader').classList.remove('fade-out');
  }
</script>

</body>
</html>
