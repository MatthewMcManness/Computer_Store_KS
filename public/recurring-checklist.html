  .instruction { background: #2a2a4a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #f39c12; }

const tbody = document.getElementById('tbody');
const KEY = 'recurring-location-checklist';

function loadState() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}

function saveState() {
  const state = {};
  schedules.forEach((s, i) => {
    const cb = document.getElementById('cb' + i);
    if (cb && cb.checked) state[s.id] = true;
  });
  localStorage.setItem(KEY, JSON.stringify(state));
  updateProgress();
  updateRows();
}

function updateProgress() {
  const state = loadState();
  const done = Object.keys(state).length;
  const total = schedules.length;
  document.getElementById('progressFill').style.width = (done / total * 100) + '%';
  document.getElementById('progressText').textContent = done + '/' + total;
}

function updateRows() {
  const state = loadState();
  schedules.forEach((s, i) => {
    const row = document.getElementById('row' + i);
    if (row) row.className = state[s.id] ? 'done' : '';
  });
}

function checkAll() {
  const state = {};
  schedules.forEach((s, i) => {
    state[s.id] = true;
    const cb = document.getElementById('cb' + i);
    if (cb) cb.checked = true;
  });
  localStorage.setItem(KEY, JSON.stringify(state));
  updateProgress();
  updateRows();
}

function resetAll() {
  if (!confirm('Reset all checkboxes?')) return;
  localStorage.removeItem(KEY);
  schedules.forEach((s, i) => {
    const cb = document.getElementById('cb' + i);
    if (cb) cb.checked = false;
  });
  updateProgress();
  updateRows();
}

// Render table
const state = loadState();
schedules.forEach((s, i) => {
  const url = 'https://thecomputerstore.repairshopr.com/schedules/' + s.id + '/edit';
  const checked = state[s.id] ? 'checked' : '';
  const cls = state[s.id] ? 'done' : '';
  const paused = s.paused ? ' <span style="color:#e74c3c">(PAUSED)</span>' : '';
  tbody.innerHTML += '<tr id="row' + i + '" class="' + cls + '">' +
    '<td><input type="checkbox" id="cb' + i + '" ' + checked + ' onchange="saveState()"></td>' +
    '<td><a href="' + url + '" target="_blank">' + s.name + '</a>' + paused + '</td>' +
    '<td>' + s.freq + '</td>' +
    '<td>' + s.next + '</td>' +
    '</tr>';
